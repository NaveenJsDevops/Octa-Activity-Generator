services:
  - type: web
    name: octa-activity-api
    runtime: python
    plan: free
    buildCommand: pip install -r apps/api/requirements.txt
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATA_DIR
        value: /tmp/octa-data
      - key: STORAGE_DIR
        value: /tmp/octa-storage
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_USERS
        sync: false
